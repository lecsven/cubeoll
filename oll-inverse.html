<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLL 互逆练习 · CubeOLL</title>
<style id="pairTheme">
  :root{--bg:#f5f6f8;--fg:#1f2328;--hd:#1f2328;--hd-fg:#fff;--hd-sub:#c9cdd2;--card-bg:#fff;--card-bd:#e2e5ea;--grp-bg:#e9ecf1;--grp-bd:#444;--nm:#8a929b;--alg:#0b3d91;--accent:#e5484d;--cell-g:#d9dbe0;--cell-y:#ffd21f;--band-g:#c3c6cc;--band-y:#f6b90a;--cell-stroke:#9aa0a6;}
  html[data-theme="dark"]{--bg:#000;--fg:#e6e8eb;--hd:#0a0c0f;--hd-fg:#fff;--hd-sub:#9aa1ab;--card-bg:#0d0f12;--card-bd:#23272d;--grp-bg:#111418;--grp-bd:#ffd21f;--nm:#7b838d;--alg:#ffd76a;--accent:#ff6b6b;--cell-g:#33383f;--cell-y:#ffd21f;--band-g:#4a4f57;--band-y:#e0a800;--cell-stroke:#000;}
  .cube{width:100%;height:auto;display:block;}
  .cube .cg{fill:var(--cell-g);} .cube .cy{fill:var(--cell-y);} .cube .bg{fill:var(--band-g);} .cube .by{fill:var(--band-y);} .cube rect{stroke:var(--cell-stroke);stroke-width:1;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  header{background:var(--hd);color:var(--hd-fg);padding:18px 24px;}
  header h1{margin:0 0 4px;font-size:20px;}
  header p{margin:2px 0;color:var(--hd-sub);font-size:13px;}
  main{max-width:1080px;margin:0 auto;padding:16px 22px 70px;}
  h2.grp{font-size:15px;margin:22px 0 10px;padding:6px 12px;background:var(--grp-bg);border-left:4px solid var(--grp-bd);border-radius:4px;}
  a{color:var(--alg);}
  .themeBtn{position:fixed;top:12px;right:12px;z-index:9;border:1px solid var(--card-bd);background:var(--card-bg);color:var(--fg);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;}
  footer{text-align:center;color:var(--nm);font-size:12px;padding:20px;}
</style>
<style id="navCss">
  .topnav{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 104px 8px 16px;min-height:44px;font-size:13px;
    background:#eef0f3;border-bottom:1px solid #dcdfe4;color:#1f2328;position:sticky;top:0;z-index:20;}
  .topnav a{color:inherit;text-decoration:none;padding:4px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{background:rgba(127,127,127,.16);}
  .topnav a.on{background:#33383f;color:#fff;border-color:#33383f;font-weight:700;}
  html[data-theme="dark"] .topnav{background:#0d0f12;border-bottom-color:#23272d;color:#e6e8eb;}
  html[data-theme="dark"] .topnav a:hover{background:rgba(255,255,255,.08);}
  html[data-theme="dark"] .topnav a.on{background:#ffd21f;color:#111;border-color:#ffd21f;}
  @media print{ .topnav{display:none;} }
</style>
<style>
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px;}
  .cats button{border:1px solid var(--card-bd);background:var(--card-bg);color:var(--fg);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;}
  .cats button.on{background:var(--grp-bd);border-color:var(--grp-bd);color:#111;font-weight:700;}
  .panel{border:1px solid var(--card-bd);border-radius:12px;background:var(--card-bg);padding:14px;}
  .bar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--nm);margin-bottom:12px;flex-wrap:wrap;}
  .bar .sp{flex:1;}
  .bar button{border:1px solid var(--card-bd);background:var(--card-bg);color:var(--fg);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;}
  .seq{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;}
  .step{flex:0 0 auto;width:150px;border:2px solid var(--card-bd);border-radius:10px;padding:8px;text-align:center;background:var(--card-bg);}
  .step.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
  .step .n{font-weight:800;font-size:12px;margin-bottom:4px;}
  .step .f{font:700 12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--alg);word-break:break-word;}
  .step .tag{font-size:11px;color:var(--nm);margin-top:4px;}
  .arrow{align-self:center;color:var(--nm);font-size:18px;}
  .tag2{align-self:center;font-size:11px;color:var(--accent);}
  .ctrls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .ctrls button{border:0;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer;}
  .ctrls .nav{background:var(--grp-bd);color:#111;font-weight:700;}
  .ctrls .reset{background:var(--grp-bg);color:var(--fg);}
  .hint{font-size:12.5px;color:var(--nm);margin-top:12px;line-height:1.7;text-align:center;}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-top:8px;}
  .lrow{border:1px solid var(--card-bd);border-radius:10px;background:var(--card-bg);padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .lrow .cube{width:50px;flex:0 0 50px;}
  .lrow code{font:700 12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--alg);}
  .lrow .sep{color:var(--nm);}
</style>
</head>
<body>
<nav class="topnav" aria-label="导航"><a href="index.html">首页</a><a href="oll.html">图解</a><a href="oll-practice.html">练习清单</a><a href="oll-trainer.html">训练器</a><a href="oll-pairs.html">互逆配对</a><a href="oll-inverse.html" class="on" aria-current="page">互逆练习</a></nav>
<button id="themeBtn" class="themeBtn" type="button">☀ 白底</button>
<header>
  <h1>OLL 互逆练习</h1>
  <p>从复原态开始：做 A →（顶面歪就先做一次 <b>U</b> 对齐）→ 做 B，顶层即复原。只看朝向，不管剩下 PLL。</p>
</header>
<main>
  <div class="cats">
    <button data-cat="bi" class="on">双向对 · 13</button>
    <button data-cat="one">单向 · 25</button>
    <button data-cat="self">自练 · 6</button>
  </div>

  <div class="panel">
    <div class="bar">
      <span id="catName">双向对</span> · <span id="grpPos">第 1 / 13 组</span>
      <span class="sp"></span>
      <button id="prevGrp">‹ 上一组</button>
      <button id="nextGrp">下一组 ›</button>
    </div>
    <div class="seq" id="seq"></div>
    <div class="ctrls">
      <button class="reset" id="prev">上一步</button>
      <button class="nav" id="next">下一步</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <h2 class="grp">全部清单（对照用）</h2>
  <div id="allLists"></div>
</main>
<footer>数据由程序逐一验证 · 图案来自 assets/ollcases.js</footer>
<script src="assets/ollcases.js"></script>
<script>
const DATA = {"bi":[[3,4],[5,8],[6,7],[9,13],[24,25],[26,27],[28,57],[31,40],[33,37],[44,45],[48,51],[49,50],[54,56]],"self":[[2,2],[20,20],[21,21],[22,22],[52,52],[53,53]],"one":[[1,2],[10,8],[11,6],[12,5],[14,10],[15,8],[16,7],[17,18],[18,19],[19,17],[23,25],[29,44],[30,44],[32,40],[34,37],[35,37],[36,43],[38,31],[39,32],[41,43],[42,41],[43,45],[46,43],[47,51],[55,48]]};
const INFO = {"1":{"name":"Runway","zh":"双面点型","alg":"(R U2 R’) (R’ F R F’) U2 (R’ F R F’)"},"2":{"name":"Zamboni","zh":"单面点型","alg":"F (R U R’ U’) F’ f (R U R’ U’) f’"},"3":{"name":"Anti-Mouse","zh":"逆小尖","alg":"f (R U R’ U’) f’ U’ F (R U R’ U’) F’"},"4":{"name":"Mouse","zh":"顺小尖","alg":"f (R U R’ U’) f’ U F (R U R’ U’) F’"},"5":{"name":"Lefty Square","zh":"左方块","alg":"r’ U2 R U R’ U r"},"6":{"name":"Righty Square","zh":"右方块","alg":"r U2 R’ U’ R U’ r’"},"7":{"name":"Wide Sune","zh":"双并左曲四","alg":"r U R’ U R U2’ r’"},"8":{"name":"Left-Wide Sune","zh":"双并右曲四","alg":"r’ U’ R U’ R’ U2 r"},"9":{"name":"Kite","zh":"点弯三","alg":"(R U R’ U’) (R’ F R2 U R’ U’ F’)"},"10":{"name":"Anti-Kite","zh":"逆点弯三","alg":"(R U R’ U) (R’ F R F’) (R U2 R’)"},"11":{"name":"Downstairs","zh":"单并右曲四","alg":"M (R U R’ U R U2 R’) U M’"},"12":{"name":"Upstairs","zh":"单并左曲四","alg":"M (L’ U’ L U’ L’ U2 L) U’ M’"},"13":{"name":"Gun","zh":"L双块","alg":"(r U’ r’) U’ (r U r’) y’ R’ U R"},"14":{"name":"Anti-Gun","zh":"反L双块","alg":"R’ F (R U R’) F’ R y’ R U’ R’"},"15":{"name":"Squeegee","zh":"反L单块","alg":"(r’ U’ r) (R’ U’ R U) (r’ U r)"},"16":{"name":"Anti-Squeegee","zh":"L单块","alg":"(r U r’) (R U R’ U’) (r U’ r’)"},"17":{"name":"Diagonal","zh":"连尖","alg":"R U R’ U (R’ F R F’) U2 (R’ F R F’)"},"18":{"name":"Crown","zh":"单面虎口","alg":"(r U R’ U R U2 r’) (r’ U’ R U’ R’ U2 r)"},"19":{"name":"Bunny","zh":"并色虎口","alg":"M U (R U R’ U’) M’ (R’ F R F’)"},"20":{"name":"X","zh":"X型","alg":"(r U R’ U’) M2 (U R U’ R’) U’ M’"},"21":{"name":"Double Sune / H","zh":"双头灯十字","alg":"F R U R’ U’ R U R’ U’ R U R’ U’ F’"},"22":{"name":"Pi / Bruno","zh":"单头灯十字","alg":"R U2’ (R2’ U’) (R2 U’) R2’ U2’ R"},"23":{"name":"Headlights","zh":"车头灯由字","alg":"R2’ D’ (R U2 R’) D (R U2 R)"},"24":{"name":"T (OCLL)","zh":"侧向由字","alg":"(r U R’ U’) (r’ F R F’)"},"25":{"name":"L (OCLL)","zh":"梅花七","alg":"F’ (r U R’ U’) r’ F R"},"26":{"name":"Anti-Sune","zh":"逆小鱼","alg":"(R U2 R’) U’ (R U’ R’)"},"27":{"name":"Sune","zh":"小鱼","alg":"(R U R’) U (R U2 R’)"},"28":{"name":"Arrow","zh":"箭头","alg":"(r U R’ U’) M (U R U’ R’)"},"29":{"name":"Chameleon","zh":"并色右点曲四","alg":"(R U R’ U’) R U’ R’ (F’ U’ F) R U R’"},"30":{"name":"Anti-Chameleon","zh":"并色左点曲四","alg":"f R U R2 U’ R’ U R2 U’ R’ f’"},"31":{"name":"Couch","zh":"侧向刀五","alg":"R’ U’ F (U R U’ R’) F’ R"},"32":{"name":"Anti-Couch","zh":"逆侧向刀五","alg":"S (R U R’ U’) R’ F R f’"},"33":{"name":"Key","zh":"侧向T","alg":"(R U R’ U’) (R’ F R F’)"},"34":{"name":"C","zh":"侧向C","alg":"(R U R’ U’) y’ (r’ U’ R U) M’"},"35":{"name":"Fish Salad","zh":"碎色点方四","alg":"(R U2 R’) (R’ F R F’) (R U2 R’)"},"36":{"name":"Wario","zh":"逆弯五","alg":"(R U R’ U’) (F’ U2 F) U (R U R’)"},"37":{"name":"Mounted Fish","zh":"并色点方四","alg":"F (R U’ R’ U’ R U R’) F’"},"38":{"name":"Mario","zh":"弯五","alg":"(R U R’ U) (R U’ R’ U’) (R’ F R F’)"},"39":{"name":"Fung","zh":"左曲五","alg":"(R U R’) (F’ U’ F) U (R U2 R’)"},"40":{"name":"Anti-Fung","zh":"右曲五","alg":"R’ F (R U R’ U’) F’ U R"},"41":{"name":"Dalmation","zh":"头灯左点曲四","alg":"(R U R’ U R U2 R’) F (R U R’ U’) F’"},"42":{"name":"Anti-Dalmation","zh":"头灯右点曲四","alg":"(L’ U’ L U’ L’ U2 L) f (U R U’ R’) f’"},"43":{"name":"Anti-P","zh":"逆头灯刀五","alg":"f’ (L’ U’ L U) f"},"44":{"name":"P","zh":"头灯刀五","alg":"f (R U R’ U’) f’"},"45":{"name":"T","zh":"头灯T","alg":"F (R U R’ U’) F’"},"46":{"name":"C-Headlight","zh":"头灯C","alg":"R’ U’ (R’ F R F’) U R"},"47":{"name":"Anti-Breakneck","zh":"单头灯右弯三","alg":"F’ L’ U’ L U L’ U’ L U F"},"48":{"name":"Breakneck","zh":"单头灯左弯三","alg":"F R U R’ U’ R U R’ U’ F’"},"49":{"name":"Squeezy","zh":"单面左弯三","alg":"R B’ R2 F R2 B R2 F’ R"},"50":{"name":"Anti-Squeezy","zh":"单面右弯三","alg":"r’ U r2 U’ r2 U’ r2 U r’"},"51":{"name":"Bottlecap","zh":"单头灯直三","alg":"f R U R’ U’ R U R’ U’ f’"},"52":{"name":"Rice Cooker","zh":"单面直三","alg":"(R’ F’ U’ F) U’ (R U R’ U R)"},"53":{"name":"Frying-Pan","zh":"双头灯左弯三","alg":"r’ U2 (R U R’ U’) R U R’ U r"},"54":{"name":"Anti-Frying-Pan","zh":"双头灯右弯三","alg":"r U r’ R U R’ U’ R U R’ U’ r U’ r’"},"55":{"name":"Highway","zh":"双面直三","alg":"R U2’ R2’ U’ R U’ R’ U2’ (F R F’)"},"56":{"name":"Streetlights","zh":"双头灯直三","alg":"(r U r’) U R U’ R’ U R U’ R’ (r U’ r’)"},"57":{"name":"H","zh":"H型","alg":"(R U R’ U’) M’ U R U’ r’"}};
let cat='bi', gi=0, step=0;
const el=x=>document.getElementById(x);
const CAT={bi:'双向对',one:'单向',self:'自练'};
function cur(){return DATA[cat][gi];}
function render(){
  const g=cur();
  el('catName').textContent=CAT[cat];
  el('grpPos').textContent='第 '+(gi+1)+' / '+DATA[cat].length+' 组';
  let h='';
  g.forEach((n,k)=>{
    if(k>0) h+= cat==='self' ? '<div class="tag2">再 AUF 后重复</div>' : '<div class="arrow">→</div>';
    const it=INFO[n];
    h+='<div class="step'+(k===step?' cur':'')+'"><div class="cube">'+(window.OLLCASE?OLLCASE(n):'')+'</div>'+
       '<div class="n">OLL '+String(n).padStart(2,'0')+' '+it.name+'</div>'+
       '<div class="f">'+it.alg+'</div>'+
       '<div class="tag">'+(k===step?'← 现在做这条':'')+'</div></div>';
  });
  el('seq').innerHTML=h;
  el('hint').textContent = cat==='self'
    ? '自练：同一条做两遍即复原顶层（中间顶面歪着就先做一次 U）。'
    : (cat==='bi' ? '双向对：不分先后，循环做即可。' : '单向：必须“先左后右”，循环做即可。')
      + '做完上一条后，若顶面图案歪着，先做一次 U 把它转到该公式对应的朝向。';
}
function renderLists(){
  let h='<h2 class="grp">双向对（'+DATA.bi.length+'）</h2><div class="list">';
  const IM = (n) => '<span class="cube">'+(window.OLLCASE?OLLCASE(n):'')+'</span>';
  const TX = (n) => '<span>OLL '+String(n).padStart(2,'0')+' '+INFO[n].name+' <code>'+INFO[n].alg+'</code></span>';
  DATA.bi.forEach(p=>{h+='<div class="lrow">'+p.map(n=>IM(n)+TX(n)).join('<span class="sep">⇄</span>')+'</div>';});
  h+='</div><h2 class="grp">单向（'+DATA.one.length+'）</h2><div class="list">';
  DATA.one.forEach(p=>{h+='<div class="lrow">'+p.map(n=>IM(n)+TX(n)).join('<span class="sep">→</span>')+'</div>';});
  h+='</div><h2 class="grp">自练（'+DATA.self.length+'）</h2><div class="list">';
  DATA.self.forEach(p=>{const n=p[0];h+='<div class="lrow">'+IM(n)+TX(n)+'</div>';});
  h+='</div>';
  el('allLists').innerHTML=h;
}
el('next').onclick=()=>{ step=(step+1)%cur().length; render(); };
el('prev').onclick=()=>{ step=(step-1+cur().length)%cur().length; render(); };
el('nextGrp').onclick=()=>{ gi=(gi+1)%DATA[cat].length; step=0; render(); };
el('prevGrp').onclick=()=>{ gi=(gi-1+DATA[cat].length)%DATA[cat].length; step=0; render(); };
document.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{
  cat=b.getAttribute('data-cat'); gi=0; step=0;
  document.querySelectorAll('.cats button').forEach(x=>x.className=x===b?'on':'');
  render();
});
render(); renderLists();
</script>
<script>(function(){var K='ollTheme',h=document.documentElement;function set(t){h.setAttribute('data-theme',t);var b=document.getElementById('themeBtn');if(b)b.textContent=(t==='dark'?'☀ 白底':'🌙 黑底');}var s=null;try{s=localStorage.getItem(K);}catch(e){}set(s==='light'?'light':'dark');var b=document.getElementById('themeBtn');if(b)b.addEventListener('click',function(){var t=h.getAttribute('data-theme')==='dark'?'light':'dark';set(t);try{localStorage.setItem(K,t);}catch(e){}});})();</script>
</body>
</html>
